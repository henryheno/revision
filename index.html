<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application de Révision - Audit Informatique</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sidebar Menu -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Sommaire</h2>
            <button id="close-menu-btn" class="close-btn">&times;</button>
        </div>
        <div id="sidebar-content" class="sidebar-content">
            <!-- Injecté via JS -->
        </div>
    </nav>

    <div class="app-container">
        <header class="app-header">
            <div class="header-top">
                <button id="menu-btn" class="menu-btn" title="Sommaire">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h1 id="dossier-title">Audit Informatique</h1>
                <div class="header-actions">
                    <button id="mode-btn" class="menu-btn mode-toggle-btn" title="Basculer entre Mode QCM et Mode Flashcard">
                        <span id="mode-text">Mode QCM</span>
                    </button>
                    <button id="repeat-btn" class="menu-btn" title="Répéter la synthèse vocale">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <h2 id="chapitre-title">Chapitre</h2>
            <h3 id="sous-point-title">Sous-point</h3>
            <div class="header-status">
                <div id="progress-text" class="progress-text">Question 1 / X</div>
                <div id="score-badge" class="score-badge">Score : <span id="score-val">0</span> / <span id="answered-val">0</span></div>
            </div>
        </header>

        <main class="feed-container" id="feed">
            <!-- La carte de la question ou le QCM sera injecté ici par JS -->
        </main>

        <div class="navigation-buttons">
            <button id="btn-prev" class="nav-btn btn-secondary">Précédent</button>
            <button id="btn-next" class="nav-btn btn-primary">Suivant</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
